<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Filtered Twitter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- X's video server refuses requests whose referer is localhost or a file path; sending none is accepted, and tells X nothing. -->
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src https:; script-src 'self'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
